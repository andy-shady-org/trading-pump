[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpfun-trading"
authors = [
    {name="Andy Wilson", email="andy@shady.org"},
]
version = "0.2.2"
description = "Pump.fun API and execution client library (proprietary, private use only)"
readme = "README.md"
requires-python = ">=3.11"
# Proprietary, all rights reserved: see LICENSE. Never publish to PyPI or any
# other package index. "Private :: Do Not Upload" makes PyPI reject uploads.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Private :: Do Not Upload",
    # 0.x (SemVer pre-1.0) and the money path is still in the staged live capital
    # gate (docs/dev/RELEASE-GATE.md §3), so Alpha rather than Production/Stable.
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
  "aiohttp>=3.9.0",
  "base58>=2.1.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
  "solana>=0.36.1",
  "solders>=0.29.0",
]

[project.scripts]
pumpbot = "pumpfun_trading.cli.bot:main"
pumpfun = "pumpfun_trading.cli.main:main"
pumpfun-cli = "pumpfun_trading.cli.main:main"
pumpfun-arb = "pumpfun_trading.cli.arbitrage:main"
pumpfun-audit = "pumpfun_trading.cli.audit:run_audit_cli"
pumpfun-events = "pumpfun_trading.cli.events:main"
pumpfun-optimize = "pumpfun_trading.cli.optimize:main"
pumpfun-replay = "pumpfun_trading.cli.replay:main"
pumpfun-recorder = "pumpfun_trading.cli.record:main"

[project.urls]
Repository = "https://github.com/andy-shady-org/pumpfun-trading"

[tool.setuptools.packages.find]
include = ["pumpfun_trading*"]
# The test suite lives inside the package (AGENTS.md) but never ships in the wheel.
exclude = ["pumpfun_trading.tests", "pumpfun_trading.tests.*"]

[project.optional-dependencies]
# Planned platform extras (Phase 5/6, docs/dev/ARCHITECTURE-DECISIONS.md). Nothing
# imports them yet; the terminal bot (`pumpbot`) needs none of them.
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
db = [
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
]
geyser = [
    "grpcio>=1.64.0",
    "protobuf>=5.27.0",
]
dev = [
    "black>=24.2.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "nox>=2024.3.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "pip-audit>=2.7.0",
    "build>=1.2.0",
]

[tool.mypy]
# Type-check against the oldest supported interpreter so 3.12+-only stdlib APIs
# are caught on the 3.14 tooling session.
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["pumpfun_trading/tests"]
addopts = "-q --strict-markers"
# `unit` / `integration` / `property` are applied by directory in
# tests/conftest.py; see docs/dev/TESTING.md for the taxonomy.
markers = [
    "unit: fast, isolated test of one module (applied by directory)",
    "integration: cross-component flow, e.g. a TradingBot driven end to end (applied by directory)",
    "property: Hypothesis property test (applied by directory)",
    "regression(bug_id): guards a resolved bug from docs/dev/BUGS.md, e.g. regression(\"BUG-96\")",
    "slow: needs real waiting or heavy computation; excluded from `nox -s tests-fast`",
]

[tool.coverage.run]
source = ["pumpfun_trading"]
branch = true
omit = [
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 95
