[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpfun-trading"
authors = [
    {name="Andy Wilson", email="andy@shady.org"},
]
version = "0.1.0"
description = "Pump.fun API and execution client library"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
  "aiohttp>=3.9.0",
  "base58>=2.1.0",
  "python-dotenv>=1.0.1",
  "requests>=2.31.0",
  "rich>=13.7.0",
  "solana>=0.36.1",
  "solders>=0.29.0",
]

[project.scripts]
pumpbot = "pumpfun_trading.cli:main"

[project.urls]
Homepage = "https://github.com/andy-shady-org/pumpfun-trading"
Documentation = "https://github.com/andy-shady-org/pumpfun-trading/blob/main/README.md"
Repository = "https://github.com/andy-shady-org/pumpfun-trading"
Issues = "https://github.com/andy-shady-org/pumpfun-trading/issues"

[tool.setuptools.packages.find]
include = ["pumpfun_trading*"]

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "ruff>=0.5.0",
    "nox>=2024.3.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pip-audit>=2.7.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["pumpfun_trading/tests"]
