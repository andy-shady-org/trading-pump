[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-pump"
authors = [
    {name="Andy Wilson", email="andy@shady.org"},
]
version = "0.4.0rc1"
description = "Pump.fun and PumpSwap (Solana) trading module for trading-core: graduation tracking, PumpSwap paper fills, the FEAT-76 lane, captures and research recorders (proprietary, private use only)"
readme = "README.md"
requires-python = ">=3.11, <3.15"
# Proprietary, all rights reserved: see LICENSE. Never publish to PyPI or any
# other package index. "Private :: Do Not Upload" makes PyPI reject uploads.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Private :: Do Not Upload",
    # 0.x (SemVer pre-1.0) and the money path is still in the staged live capital
    # gate (docs/dev/RELEASE-GATE.md §3), so Alpha rather than Production/Stable.
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# trading-core is private: install it first (noxfile.py, docs/dev/TESTING.md),
# then this package resolves the requirement against the installed copy.
dependencies = [
  "trading-core>=0.2.0",
  "aiohttp>=3.9.0",
  "base58>=2.1.0",
  "rich>=13.7.0",
  "solana>=0.36.1",
  "solders>=0.29.0",
]

[project.scripts]
trading-pump = "trading_pump.cli.main:main"
trading-pump-recorder = "trading_pump.cli.record:main"

# The module, for trading-core (`"module": "pumpfun"`, trading-core
# docs/MODULE-GUIDE.md §6).
[project.entry-points."trading_core.modules"]
pumpfun = "trading_pump.module:PumpModule"

[project.urls]
Repository = "https://github.com/andy-shady-org/trading-pump"

[tool.setuptools.packages.find]
include = ["trading_pump*"]
# The test suite lives inside the package (AGENTS.md) but never ships in the wheel.
exclude = ["trading_pump.tests", "trading_pump.tests.*"]

[project.optional-dependencies]
dev = [
    "black>=26.1.0",
    "flake8>=7.1.0",
    "ruff>=0.15.0",
    "mypy>=1.18.0",
    "nox>=2025.5.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.140.0",
    "pip-audit>=2.9.0",
    "build>=1.3.0",
]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313", "py314"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C", "I", "B", "UP"]
# C901 (complexity) is reviewed by hand; B008 flags dataclass field defaults.
ignore = ["C901", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["trading_pump"]

[tool.mypy]
# Type-check against the oldest supported interpreter so 3.12+-only stdlib
# APIs are caught.
python_version = "3.11"
packages = ["trading_pump"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["trading_pump.tests.*"]
disallow_untyped_defs = false
# The SDK tests stub client methods on instances (``client.x = AsyncMock()``).
disable_error_code = ["method-assign"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["trading_pump/tests"]
addopts = "-q --strict-markers"
# `unit` / `integration` / `property` are applied by directory in
# tests/conftest.py; see docs/dev/TESTING.md for the taxonomy.
markers = [
    "unit: fast, isolated test of one module (applied by directory)",
    "integration: cross-component flow, e.g. TradingEngine driven with the module end to end (applied by directory)",
    "property: Hypothesis property test (applied by directory)",
    "regression(bug_id): guards a resolved bug from docs/dev/BUGS.md, e.g. regression(\"BUG-96\")",
    "slow: needs real waiting or heavy computation; excluded from `nox -s tests-fast`",
]

[tool.coverage.run]
source = ["trading_pump"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
]
