[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpfun-trading"
authors = [
    {name="Andy Wilson", email="andy@shady.org"},
]
version = "0.1.1"
description = "Pump.fun API and execution client library (proprietary, private use only)"
readme = "README.md"
requires-python = ">=3.11"
# Proprietary, all rights reserved: see LICENSE. Never publish to PyPI or any
# other package index. "Private :: Do Not Upload" makes PyPI reject uploads.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
  "aiohttp>=3.9.0",
  "base58>=2.1.0",
  "python-dotenv>=1.0.1",
  "requests>=2.31.0",
  "rich>=13.7.0",
  "solana>=0.36.1",
  "solders>=0.29.0",
]

[project.scripts]
pumpbot = "pumpfun_trading.cli.bot:main"
pumpfun = "pumpfun_trading.cli.main:main"
pumpfun-cli = "pumpfun_trading.cli.main:main"
pumpfun-arb = "pumpfun_trading.cli.arbitrage:main"
pumpfun-audit = "pumpfun_trading.cli.audit:run_audit_cli"
pumpfun-events = "pumpfun_trading.cli.events:main"
pumpfun-optimize = "pumpfun_trading.cli.optimize:main"
pumpfun-replay = "pumpfun_trading.cli.replay:main"
pumpfun-recorder = "pumpfun_trading.cli.record:main"

[project.urls]
Repository = "https://github.com/andy-shady-org/pumpfun-trading"

[tool.setuptools.packages.find]
include = ["pumpfun_trading*"]

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "nox>=2024.3.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pip-audit>=2.7.0",
    "build>=1.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["pumpfun_trading/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pumpfun_trading"]
branch = true
omit = [
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 95
