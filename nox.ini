[nox]
locations = .
python = 3.11

[nox.session]
venv_backend = virtualenv

[nox.session.tests]
commands =
    python -m pip install -e .[dev]
    pytest -q

[nox.session.lint]
commands =
    python -m pip install -e .[dev]
    ruff check .
    black --check .

[nox.session.audit]
commands =
    python -m pip install -e .[dev]
    pip-audit

[nox.session.format]
commands =
    python -m pip install -e .[dev]
    black .

